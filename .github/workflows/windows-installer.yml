# Builds the Windows installers (MSI + portable ZIP) on a standard GitHub-hosted runner and keeps
# them as workflow artifacts. Signed only when signing secrets are set; otherwise unsigned
# (SmartScreen asks once: "More info" → "Run anyway"; see site/install.html).
name: Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CREATTE_TOOL_BUILD_SHA: ${{ github.sha }}

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: installer-windows-${{ matrix.arch }}
      - name: Build date
        shell: pwsh
        run: "\"CREATTE_TOOL_BUILD_DATE=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd'))\" >> $env:GITHUB_ENV"
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Build and package
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: creatte-tool-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
